# Test code may panic — that is what a failing test is.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Reserved for banning specific types even in code that compiles cleanly
# (e.g. `std::collections::HashMap` in a host-side crate, for iteration-order
# determinism). Empty today: no type is currently banned, so this lint is a
# no-op until something is listed here.
disallowed-types = []

# Keeps MSRV-aware lints (e.g. `manual_strip`) from suggesting a rewrite that
# needs a newer Rust than we declare. It has no bearing on 32- vs 64-bit
# portability — that risk is covered separately, by CI cross-compiling every
# bare-metal crate for both ARM targets on every push (see
# docs/internals/workspace-layout.md).
msrv = "1.90"
